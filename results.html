<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Marketplace Mockup</title>
  <link rel="stylesheet" href="results.css">
</head>
<body>
  <!-- SIDEBAR-->
  <aside id="sidebar">
    <ul>
      <li>Apps</li>
      <li>Games</li>
      <li>Movies</li>
      <li>Books</li>
      <li>Newspapers</li>
    </ul>
  </aside>
  
  <!-- HEADER -->
  <header>
    <div class="header-left">
      <!-- Menu Toggle Icon -->
      <div class="menu-icon" id="menu-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <!-- Logo Placeholder -->
      <div class="logo">WebMarket</div>
    </div>
    <div class="header-center">
      <div class="home-link">Home</div>
      <div class="search-bar">
        <input type="text" placeholder="Search" />
      </div>
      <div class="cart">Cart</div>
    </div>
    <div class="header-right">
      <!-- Profile Icon Placeholder -->
      <div class="profile-icon">
        <img src="https://via.placeholder.com/30" alt="Profile" />
      </div>
    </div>
  </header>
  
  <!-- CONTENT -->
  <div class="main-wrapper">
    <main>
      <div class="products-grid">
        <!-- Example Product Cards -->
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-name">Product Name 1</div>
          <div class="product-price">$21.99</div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-name">Product Name 2</div>
          <div class="product-price">$10.99</div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-name">Product Name 3</div>
          <div class="product-price">$18.99</div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-name">Product Name 4</div>
          <div class="product-price">$40.99</div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-name">Product Name 5</div>
          <div class="product-price">$60.99</div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-name">Product Name 6</div>
          <div class="product-price">$35.99</div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- FOOTER -->
  <footer>
    <div class="footer-links">
      <a href="#">Customer Care</a>
      <a href="#">Legal Use</a>
      <a href="#">Careers</a>
      <a href="#">Follow Us</a>
    </div>
    <div class="copy">© 2025, Interactive Web Designs</div>
  </footer>
  
  <script>
    // Toggle the sidebar when the menu icon is clicked.
    // same icon opens and closes the sidebar.
    document.getElementById('menu-icon').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('active');
    });
  </script>
</body>
</html>
